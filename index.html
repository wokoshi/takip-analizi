<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letterboxd Takip Analizi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B110D;
            --surface-card: #111A13;
            --surface-input: #0A130D;
            --border-subtle: #18261B;
            --border-highlight: rgba(255, 255, 255, 0.08);
            --brand-green: #00E054;
            --brand-green-hover: #00C247;
            --brand-dark-green: #1B5E32;
            --text-primary: #FFFFFF;
            --text-secondary: #899B8E;
            --text-muted: #536457;
            --link-accent: #40BCF4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.main-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1.2px;
            text-align: center;
            margin-bottom: 14px;
        }

        h1.main-title .white-text {
            color: var(--text-primary);
            display: block;
        }

        h1.main-title .green-text {
            color: var(--brand-green);
            display: block;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .card-container {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            margin-bottom: 20px;
        }

        .switch-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #0D1610;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 16px;
        }

        .switch-option {
            position: relative;
            cursor: pointer;
            text-align: center;
            padding: 12px 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
            outline: none;
        }

        .switch-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .switch-option:has(input:checked) {
            background-color: var(--brand-green);
            color: #05140A;
            font-weight: 700;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--surface-input);
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2F5938;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button.btn-check {
            background-color: var(--brand-green);
            color: #05140A;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button.btn-check:hover {
            background-color: var(--brand-green-hover);
        }

        button.btn-check:disabled {
            background-color: #172B1D;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .unified-status-card {
            width: 100%;
            display: none;
            flex-direction: column;
            background: #0E1811;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            gap: 14px;
        }

        .unified-profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .unified-profile-header img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #142217;
            flex-shrink: 0;
            border: 2px solid var(--brand-green);
        }

        .profile-preview-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-preview-text .name {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-preview-text a {
            font-size: 12px;
            color: var(--brand-green);
            text-decoration: none;
        }

        .profile-preview-text a:hover {
            text-decoration: underline;
        }

        .unified-divider {
            height: 1px;
            background: var(--border-subtle);
            width: 100%;
        }

        .unified-status-body {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .unified-status-body b {
            color: #FFFFFF;
        }

        .results-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #16241A;
            flex-shrink: 0;
        }

        .card-details {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-details b {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-details a {
            color: var(--link-accent);
            text-decoration: none;
            font-size: 12px;
        }

        .card-details a:hover {
            text-decoration: underline;
        }

        .empty-alert {
            grid-column: span 2;
            text-align: center;
            padding: 32px 20px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 224, 84, 0.12);
            color: var(--brand-green);
            font-size: 16px;
        }

        footer.footer-sig {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            width: 100%;
        }

        footer.footer-sig a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 520px) {
            h1.main-title {
                font-size: 2.3rem;
            }
            .action-row {
                flex-direction: column;
            }
            button.btn-check {
                width: 100%;
            }
            .results-grid {
                grid-template-columns: 1fr;
            }
            .empty-alert {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">
        <span class="white-text">Letterboxd</span>
        <span class="green-text">Takip Analizi</span>
    </h1>

    <p class="subtitle">Takipçi ve takip edilen durumunuzu doğrudan karşılaştırın.</p>

    <div class="card-container">
        <div class="switch-group">
            <label class="switch-option">
                <input type="radio" name="mode" value="not_following_me" checked>
                Beni Takip Etmeyenler
            </label>
            <label class="switch-option">
                <input type="radio" name="mode" value="i_dont_follow">
                Benim Takip Etmediklerim
            </label>
        </div>

        <div class="action-row">
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="kullanıcı adı veya profil linki..." autocomplete="off" spellcheck="false" />
            </div>
            <button id="startBtn" class="btn-check" onclick="analiziBaslat()">Sorgula</button>
        </div>
    </div>

    <div id="unifiedPanel" class="unified-status-card">
        <div id="unifiedProfileHeader" class="unified-profile-header">
            <img id="profileAvatar" src="https://s.ltrbxd.com/static/img/avatar220.png" alt="Profil" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://s.ltrbxd.com/static/img/avatar220.png';" />
            <div class="profile-preview-text">
                <div id="profileName" class="name">Kullanıcı Adı</div>
                <a id="profileLink" href="#" target="_blank">Letterboxd Profilini Gör ↗</a>
            </div>
        </div>
        <div id="unifiedDivider" class="unified-divider"></div>
        <div id="statusBox" class="unified-status-body"></div>
    </div>

    <div id="resultsGrid" class="results-grid"></div>

    <footer class="footer-sig">
        Created by <a href="https://letterboxd.com/wokoshi/" target="_blank">wokoshi</a>
    </footer>
</div>
